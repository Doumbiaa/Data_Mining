{% extends "layout.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 mt-5">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">🔍 Prédiction de Segment</h2>
                    <form id="predictForm">
                        <div class="mb-3">
                            <label>Fréquence</label>
                            <input type="number" id="frequence" class="form-control" required step="any">
                        </div>
                        <div class="mb-3">
                            <label>Quantité totale</label>
                            <input type="number" id="quantite" class="form-control" required step="any">
                        </div>
                        <div class="mb-3">
                            <label>Montant total</label>
                            <input type="number" id="montant" class="form-control" required step="any">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Analyser le client</button>
                    </form>
                    <div id="result" class="mt-4 text-center h4 text-primary"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('predictForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            frequence: document.getElementById('frequence').value,
            quantite: document.getElementById('quantite').value,
            montant: document.getElementById('montant').value
        };
        const response = await fetch('/predict', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await response.json();
        document.getElementById('result').innerText = result.message;
    };
</script>
{% endblock %}
