<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Intelligence Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fond global en gris clair */
        body { 
            background-color: #f8f9fa; 
            color: #212529; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-tool { 
            background: #ffffff; 
            border: none; /* On retire la bordure pour un look plus propre avec l'ombre */
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            cursor: pointer; 
            height: 100%; 
            color: #212529;
            /* Ombre portée sur le fond gris */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        }

        .card-tool:hover { 
            transform: translateY(-10px); 
            background: #212529; 
            color: #ffffff;
            /* Ombre plus forte quand la carte se lève */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .icon-box { font-size: 3.5rem; margin-bottom: 1.5rem; }
        
        a { text-decoration: none; color: inherit; }

        .btn-outline-custom {
            border: 2px solid currentColor;
            color: inherit;
            border-radius: 12px;
            padding: 10px 30px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .display-3 { letter-spacing: -2px; color: #212529; }
    </style>
</head>
<body>
    <div class="container text-center">
        <header class="mb-5">
            <h1 class="display-3 fw-bold mb-2">Xalaam Tech</h1>
            <p class="lead text-secondary">La puissance analytique au service de votre business</p>
        </header>
        
        <div class="row g-4 justify-content-center">
            
            <div class="col-md-4">
                <a href="/recommandation">
                    <div class="card card-tool p-5">
                        <div class="icon-box">🛒</div>
                        <h3 class="fw-bold h4">Recommandation</h3>
                        <p class="small text-muted mb-4">Analyse des paniers avec l'algorithme Apriori.</p>
                        <div class="mt-auto">
                            <span class="btn btn-outline-custom">Lancer</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="/rfm">
                    <div class="card card-tool p-5">
                        <div class="icon-box">👥</div>
                        <h3 class="fw-bold h4">Segmentation RFM</h3>
                        <p class="small text-muted mb-4">Score de Récence, Fréquence et Montant.</p>
                        <div class="mt-auto">
                            <span class="btn btn-outline-custom">Gérer</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="/kmeans">
                    <div class="card card-tool p-5">
                        <div class="icon-box">🤖</div>
                        <h3 class="fw-bold h4">Clustering IA</h3>
                        <p class="small text-muted mb-4">Segmentation avancée par Machine Learning.</p>
                        <div class="mt-auto">
                            <span class="btn btn-outline-custom">Explorer</span>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </div>
</body>
</html>
